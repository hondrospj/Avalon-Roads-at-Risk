name: Refresh Avalon Roads history every six hours
on:
  schedule:
    - cron: "25 2,8,14,20 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: avalon-roads-six-hour-data-refresh
  cancel-in-progress: false
jobs:
  refresh-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.shorelysafe/
            /tools/
            /tests/
            /flood_stats.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify existing schema, station, statistics and fixed calibration
        run: node --test tests/refresh_history.test.cjs
      - name: Refresh measured daily history from the existing Avalon USGS gauge
        run: node tools/update_history.js
      - name: Commit current measured history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flood_stats.json
          git diff --cached --quiet || git commit -m "Refresh Avalon Roads measured history"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Publish current data while preserving deployed UI and terrain
        env:
          GH_TOKEN: ${{ github.token }}
          SHORELYSAFE_TOKEN: ${{ secrets.SHORELYSAFE_PUBLISH_TOKEN }}
        run: python3 .shorelysafe/publish_data_overlay.py --app roads-at-risk--avalon
      - name: Retain refresh provenance and exact publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avalon-roads-six-hour-refresh-receipt
          path: data-overlay-publication-receipt.json
          if-no-files-found: ignore
